name: Repair ERP dependency security

on:
  push:
    branches:
      - feature/module-field-catalog-45-20261016
    paths:
      - .github/workflows/security-dependency-remediation.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Refresh dependency lock with approved version constraints
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit fix --package-lock-only --ignore-scripts --omit=dev --no-fund
          git diff --exit-code -- package.json frontend/package.json backend/package.json
      - name: Check exact security resolutions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          const packages = lock.packages;
          const expected = {
            next: '16.4.2',
            multer: '2.4.0',
            'proxy-addr': '2.0.8',
            'source-map-js': '1.2.2',
            sharp: '0.35.5'
          };
          for (const [name, version] of Object.entries(expected)) {
            const installed = Object.entries(packages).filter(([path]) => path === 'node_modules/' + name || path.endsWith('/node_modules/' + name));
            assert.ok(installed.length, 'Missing package: ' + name);
            for (const [path, meta] of installed) assert.equal(meta.version, version, 'Vulnerable resolution at ' + path);
            console.log(name + ' ' + version);
          }
          NODE
      - name: Reproducible installation
        run: npm ci --no-fund
      - name: Audit all production dependencies (moderate and above)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate Prisma schema and generate client
        run: |
          npx prisma validate --schema database/prisma/schema.prisma
          npm run prisma:generate
      - name: Validate TypeScript
        run: npm run lint
      - name: Run backend and frontend tests
        run: npm run test
      - name: Build both applications
        run: npm run build:all
      - name: Commit and push audited lockfile to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current"
          else
            git commit -m "security: regenerate verified lockfile with patched dependencies"
            git push origin HEAD:feature/module-field-catalog-45-20261016
          fi
