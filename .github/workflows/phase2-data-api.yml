name: Fase 2 - Datos y API

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "database/**"
      - ".github/workflows/phase2-data-api.yml"
  push:
    branches:
      - feature/phase2-data-readiness-api-20261016

permissions:
  contents: read

jobs:
  data-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-fund
      - name: Audit production packages
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate Prisma models
        run: npx prisma validate --schema database/prisma/schema.prisma
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Backend TypeScript
        run: npm --workspace backend run lint
      - name: Backend unit, security and registry tests
        run: npm --workspace backend run test
      - name: Frontend TypeScript
        run: npm --workspace frontend run lint
      - name: Frontend tests
        run: npm --workspace frontend run test
      - name: Compile frontend
        run: npm --workspace frontend run build:site
