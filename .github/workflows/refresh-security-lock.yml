name: Refresh Security Lock

on:
  push:
    paths:
      - .github/refresh-security-lock.trigger

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Regenerate package lock with security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched Multer resolution
        run: node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/multer']; if(!p || p.version!=='2.3.0') { console.error(p); process.exit(1) } console.log('multer',p.version)"
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "security: refresh lockfile with patched dependencies"
            git push origin HEAD:main
          fi
