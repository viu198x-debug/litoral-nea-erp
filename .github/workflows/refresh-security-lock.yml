name: Refresh Security Lock

on:
  push:
    branches: [main]
    paths:
      - .github/refresh-security-lock.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Regenerate lock without weakening security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched dependency resolutions
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const packages = require('./package-lock.json').packages;
          for (const [name, minimum] of Object.entries({
            next: [16, 4, 2],
            multer: [2, 4, 0],
            'proxy-addr': [2, 0, 8],
            sharp: [0, 35, 5],
            'source-map-js': [1, 2, 2],
          })) {
            const matches = Object.entries(packages).filter(([path]) =>
              path === 'node_modules/' + name || path.endsWith('/node_modules/' + name)
            );
            assert.ok(matches.length, 'Missing ' + name);
            for (const [path, entry] of matches) {
              const actual = entry.version.split('.').slice(0, 3).map(Number);
              assert.ok(actual[0] > minimum[0] ||
                (actual[0] === minimum[0] &&
                (actual[1] > minimum[1] ||
                (actual[1] === minimum[1] && actual[2] >= minimum[2]))),
                'Insecure version at ' + path + ': ' + entry.version
              );
            }
          }
          NODE
      - name: Reproducible installation
        run: npm ci --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "security: refresh audited dependency lockfile"
            git push origin HEAD:main
          fi
