name: litoral-nea-erp

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litoral_nea_erp}
      POSTGRES_USER: ${POSTGRES_USER:-litoral_nea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litoral_nea} -d ${POSTGRES_DB:-litoral_nea_erp}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [erp_internal]
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      API_PREFIX: api/v1
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      BACKEND_PUBLIC_URL: ${DOCKER_PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-litoral_nea}:${POSTGRES_PASSWORD:-cambiar_en_produccion}@postgres:5432/${POSTGRES_DB:-litoral_nea_erp}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-reemplazar_por_64_caracteres_aleatorios}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-reemplazar_por_otro_secreto_64_caracteres}
      CSRF_SECRET: ${CSRF_SECRET:-reemplazar_por_un_tercer_secreto_64_caracteres}
      JWT_ISSUER: ${JWT_ISSUER:-litoral-nea-erp}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-litoral-nea-api}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCK_MINUTES: ${LOCK_MINUTES:-15}
      MAX_ACTIVE_SESSIONS: ${MAX_ACTIVE_SESSIONS:-5}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      ALLOW_SELF_APPROVAL: ${ALLOW_SELF_APPROVAL:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      DOCUMENT_STORAGE_PATH: /app/storage/documents
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - document_storage:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erp_internal]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    networks: [erp_internal]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  gateway:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [erp_internal]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  backup:
    build:
      context: .
      dockerfile: docker/backup.Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-litoral_nea_erp}
      PGUSER: ${POSTGRES_USER:-litoral_nea}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_produccion}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_CRON: "${BACKUP_CRON:-0 2 * * *}"
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [erp_internal]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  document_storage:

networks:
  erp_internal:
    driver: bridge
